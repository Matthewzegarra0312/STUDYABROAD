<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ruta de progreso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=Lilita+One&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<section aria-label="Progreso del pasaporte" style="width:358px;height:112px;box-sizing:border-box;border-radius:20px;border:2px solid rgba(253,254,252,.35);background:rgba(18,22,74,.46);padding:12px 14px 10px;display:flex;flex-direction:column;gap:10px;font-family:Figtree,sans-serif;color:#FDFEFC">
  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
    <div style="display:flex;align-items:baseline;gap:7px">
      <span style="font-family:'Lilita One',sans-serif;font-size:32px;line-height:1;color:#FFE36B">{{n}} / 4</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.16em">SELLOS</span>
    </div>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.06em;text-align:right;color:rgba(253,254,252,.85)">{{siguiente}}</span>
  </div>
  <ol style="margin:0;padding:0;list-style:none;display:flex;align-items:flex-start">
    <sc-for list="{{nodos}}" as="nd" hint-placeholder-count="4">
      <li style="display:flex;align-items:flex-start;flex-grow:{{nd.grow}}">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;width:52px">
          <sc-if value="{{nd.hecho}}" hint-placeholder-val="{{ true }}">
            <span style="display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:{{nd.c}};border:2.5px solid #FDFEFC;box-sizing:border-box">
              <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" style="fill:none;stroke:#FDFEFC;stroke-width:3.4px;stroke-linecap:round;stroke-linejoin:round"></path></svg>
            </span>
          </sc-if>
          <sc-if value="{{nd.falta}}" hint-placeholder-val="{{ false }}">
            <span style="display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2.5px dashed rgba(253,254,252,.7);box-sizing:border-box;font-family:'Lilita One',sans-serif;font-size:13px;color:rgba(253,254,252,.85)">{{nd.num}}</span>
          </sc-if>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.04em;text-align:center;line-height:1.1;white-space:nowrap">{{nd.corto}}</span>
        </div>
        <sc-if value="{{nd.tramo}}" hint-placeholder-val="{{ true }}">
          <div style="position:relative;flex-grow:1;height:28px;display:flex;align-items:center;margin:0 -12px">
            <div style="width:100%;border-top:3px {{nd.linea}} {{nd.colorLinea}}"></div>
            <sc-if value="{{nd.avion}}" hint-placeholder-val="{{ false }}">
              <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#FFE36B;box-shadow:0 2px 0 rgba(8,10,45,.3)">
                <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(90deg)"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" style="fill:#1D2152"></path></svg>
              </span>
            </sc-if>
          </div>
        </sc-if>
      </li>
    </sc-for>
  </ol>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"n":{"editor":"int","default":2,"min":0,"max":4},"$preview":{"width":358,"height":112}}'>
class Component extends DCLogic {
  renderVals() {
    const n = Math.max(0, Math.min(4, Number(this.props.n ?? 2)));
    const base = [
      { corto: 'UTP', largo: 'UTP Internacional', c: '#6258BB', num: '1' },
      { corto: 'EDUCATIONUSA', largo: 'EducationUSA', c: '#AC0BAD', num: '2' },
      { corto: 'JAPÓN', largo: 'Study in Japan', c: '#525F97', num: '3' },
      { corto: 'ERASMUS', largo: 'Erasmus Mundus', c: '#22709F', num: '4' }
    ];
    const nodos = base.map((b, i) => ({
      ...b,
      hecho: i < n,
      falta: i >= n,
      tramo: i < 3,
      grow: i < 3 ? 1 : 0,
      avion: n > 0 && n < 4 && i === n - 1,
      linea: i < n - 1 ? 'solid' : 'dashed',
      colorLinea: i < n - 1 ? '#FDFEFC' : 'rgba(253,254,252,.55)'
    }));
    const sig = n >= 4 ? 'Pasaporte completo' : (n === 0 ? 'Empieza por cualquier puerta' : 'Te faltan ' + (4 - n));
    return { n, nodos, siguiente: sig };
  }
}
</script>
</body>
</html>
