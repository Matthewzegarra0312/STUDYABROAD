<script type="text/x-dc" data-dc-script data-props='{"stand":{"editor":"enum","options":["utp-internacional","educationusa","study-in-japan","erasmus-mundus"],"default":"utp-internacional"},"estado":{"editor":"enum","options":["sellado","pendiente"],"default":"sellado"},"size":{"editor":"int","default":200,"min":40,"max":400},"rot":{"editor":"int","default":-8,"min":-30,"max":30,"unit":"°"},"clase":{"editor":null},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const stand = this.props.stand ?? 'utp-internacional';
    const sellado = (this.props.estado ?? 'sellado') !== 'pendiente';
    const size = Number(this.props.size ?? 200);
    const rot = Number(this.props.rot ?? -8);
    const info = {
      'utp-internacional': { n: 'UTP Internacional', num: '01', c: '#6258BB' },
      'educationusa': { n: 'EducationUSA', num: '02', c: '#AC0BAD' },
      'study-in-japan': { n: 'Study in Japan', num: '03', c: '#525F97' },
      'erasmus-mundus': { n: 'Erasmus Mundus', num: '04', c: '#22709F' }
    }[stand] || { n: stand, num: '00', c: '#525F97' };
    return {
      px: size + 'px',
      tf: sellado ? 'rotate(' + rot + 'deg)' : 'none',
      clase: this.props.clase ?? '',
      aria: sellado ? 'Sello de ' + info.n : 'Sello pendiente de ' + info.n,
      c: info.c,
      num: info.num,
      utpS: sellado && stand === 'utp-internacional',
      usaS: sellado && stand === 'educationusa',
      jpS: sellado && stand === 'study-in-japan',
      euS: sellado && stand === 'erasmus-mundus',
      pUtp: !sellado && stand === 'utp-internacional',
      pUsa: !sellado && stand === 'educationusa',
      pJp: !sellado && stand === 'study-in-japan',
      pEu: !sellado && stand === 'erasmus-mundus'
    };
  }
}
</script>
