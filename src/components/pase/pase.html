<div class="saf-pase" style="width:100%;max-width:375px;margin:0 auto;box-sizing:border-box;padding:22px 18px;border-radius:18px;background-color:#3F8FCB;background-image:url('/pase-assets/fondo.jpg');background-size:cover;background-position:center top;background-repeat:no-repeat;color:#1D2152;font-family:'Figtree','Segoe UI',Helvetica,Arial,sans-serif;">
  <div style="border-radius:22px;overflow:hidden;box-shadow:0 8px 0 rgba(8,10,45,.3),0 22px 34px -14px rgba(8,10,45,.6);background:#FDFEFC;">
    <div style="background:#FDFEFC;color:#1D2152;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1D2152;padding:12px 16px;color:#FDFEFC;">
        <img src="/pase-assets/logo-study.png" width="92" alt="Study Abroad Fest" style="display:block;height:44px;width:auto;border:0;">
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
          <span style="font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;font-size:11px;font-weight:600;letter-spacing:.16em;color:rgba(253,254,252,.7);white-space:nowrap;">VUELO SAF·2026</span>
          <span style="display:inline-flex;align-items:center;gap:6px;font-family:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif;font-size:19px;line-height:1;font-weight:400;color:#FFE36B;white-space:nowrap;">LIMA
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="display:block;transform:rotate(90deg);"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="#FFE36B"></path></svg>
            EL MUNDO</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;padding:16px 18px 22px;">
        <div style="display:flex;flex-direction:column;gap:3px;">
          <span style="font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;color:#4A507C;">PASAJERO</span>
          <span style="font-family:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif;font-weight:400;font-size:{{nombre_px}}px;line-height:1.02;letter-spacing:.2px;text-transform:uppercase;color:#1D2152;">{{nombre}}</span>
        </div>
        <div style="display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;">
          <div style="display:flex;flex-direction:column;gap:2px;"><span style="font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;color:#4A507C;">FECHA</span><span style="font-size:15px;font-weight:800;line-height:1.2;">Sáb 10 oct 2026</span></div>
          <div style="display:flex;flex-direction:column;gap:2px;"><span style="font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;color:#4A507C;">EMBARQUE</span><span style="font-size:15px;font-weight:800;line-height:1.2;">2:00 p.m.</span></div>
          <div style="display:flex;flex-direction:column;gap:2px;"><span style="font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;color:#4A507C;">LLEGADA</span><span style="font-size:15px;font-weight:800;line-height:1.2;">6:00 p.m.</span></div>
        </div>
        <div style="display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;">
          <div style="grid-column:span 2;display:flex;flex-direction:column;gap:2px;"><span style="font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;color:#4A507C;">PUERTA</span><a href="https://maps.app.goo.gl/3AqFumREKmqrjo4q7" target="_blank" rel="noopener noreferrer" style="font-size:15px;font-weight:800;line-height:1.2;color:#1D2152;text-decoration:none;">Centro de convenciones UTP&nbsp;<span style="color:#6258BB;">↗</span></a></div>
          <div style="display:flex;flex-direction:column;gap:2px;"><span style="font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;color:#4A507C;">TARIFA</span><span style="font-size:15px;font-weight:800;line-height:1.2;">Gratis</span></div>
        </div>
      </div>
    </div>
    <div style="position:relative;background-color:#8A2FB4;background-image:linear-gradient(100deg,#AC0BAD,#6258BB);border-top:3px dashed #FDFEFC;padding:18px 18px 18px;display:flex;align-items:center;gap:14px;color:#FDFEFC;">
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0;flex-grow:1;">
        <span style="font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;">ASIENTO</span>
        <span style="font-family:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif;font-size:42px;line-height:.9;font-weight:400;">Tuyo</span>
        <span style="font-size:13px;font-weight:700;line-height:1.3;">Muestra este QR en el ingreso, con el brillo alto.</span>
      </div>
      <div style="flex-shrink:0;border-radius:16px;border:4px solid #FDFEFC;background:#FFFFFF;padding:9px;box-shadow:0 5px 0 rgba(8,10,45,.25);font-size:0;line-height:0;">
        <img src="{{qr_src}}" width="118" height="118" alt="QR de tu inscripción en Luma" style="display:block;width:118px;height:118px;border:0;">
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;padding:{{pie_espacio}}px 0 0;">
    <img src="/pase-assets/logo-lead.png" width="116" alt="LEAD UTP y UTP" style="display:block;width:116px;height:auto;border:0;">
    <span style="padding-top:6px;font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;font-size:11px;font-weight:600;letter-spacing:.16em;color:#FDFEFC;text-transform:uppercase;">LEAD UTP · UTP Internacional</span>
  </div>
</div>
